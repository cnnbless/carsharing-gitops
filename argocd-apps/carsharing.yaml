apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: carsharing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cnnbless/carsharing-gitops.git
    targetRevision: master
    path: charts/carsharing
    helm:
      valueFiles:
        - values-minikube.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: carsharing
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
