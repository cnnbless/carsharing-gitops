existingSecret: ""

config:
  profile: "prod"
  defaultRole: "CUSTOMER"
  logLevel: "INFO"

secrets:
  dbPassword: ""
  jwtSecret: ""

ingress:
  enabled: true
  host: "carsharing.local"

postgres:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi

userService:
  replicas: 2
  image:
    repository: "cnnblesss/carsharing-user-service"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 8082
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

fleetService:
  replicas: 2
  image:
    repository: "cnnblesss/carsharing-fleet-service"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 8081
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

orderService:
  replicas: 2
  image:
    repository: "cnnblesss/carsharing-order-service"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 8083
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
