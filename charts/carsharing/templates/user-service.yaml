apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "carsharing.fullname" . }}-user
  labels:
    {{- include "carsharing.labels" . | nindent 4 }}
    app: user-service
spec:
  replicas: {{ .Values.userService.replicas }}
  selector:
    matchLabels:
      app: user-service
      instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "carsharing.labels" . | nindent 8 }}
        app: user-service
        instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: user-service
          image: "{{ .Values.userService.image.repository }}:{{ .Values.userService.image.tag }}"
          imagePullPolicy: {{ .Values.userService.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.userService.port }}
          env:
            - name: APP_VERSION
              value: {{ .Values.userService.image.tag | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default (printf "%s-secret" (include "carsharing.fullname" .)) | quote }}
                  key: DB_PASSWORD
          envFrom:
            - configMapRef:
                name: {{ include "carsharing.fullname" . }}-config
            - secretRef:
                name: {{ .Values.existingSecret | default (printf "%s-secret" (include "carsharing.fullname" .)) | quote }}
          resources:
            {{- toYaml .Values.userService.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.userService.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: {{ .Values.userService.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "carsharing.fullname" . }}-user
  labels:
    {{- include "carsharing.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.userService.port }}
      targetPort: {{ .Values.userService.port }}
      protocol: TCP
  selector:
    app: user-service
    instance: {{ .Release.Name }}
