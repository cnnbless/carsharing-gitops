{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "carsharing.fullname" . }}-user
  labels:
    {{- include "carsharing.labels" . | nindent 4 }}
    app: user-service
spec:
  replicas: {{ .Values.userService.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: user-service
      instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "carsharing.labels" . | nindent 8 }}
        app: user-service
        instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: user-service
          image: "{{ .Values.userService.image.repository }}:{{ .Values.userService.image.tag }}"
          imagePullPolicy: {{ .Values.userService.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.userService.port }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:TieredStopAtLevel=1 -Xmx192m"
            - name: APP_VERSION
              value: {{ .Values.userService.image.tag | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default (printf "%s-secret" (include "carsharing.fullname" .)) | quote }}
                  key: DB_PASSWORD
          envFrom:
            - configMapRef:
                name: {{ include "carsharing.fullname" . }}-config
            - secretRef:
                name: {{ .Values.existingSecret | default (printf "%s-secret" (include "carsharing.fullname" .)) | quote }}
          resources:
            {{- toYaml .Values.userService.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.userService.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: {{ .Values.userService.port }}
            initialDelaySeconds: 180
            periodSeconds: 15
            failureThreshold: 5
  strategy:
    {{- toYaml .Values.rollout.strategy | nindent 4 }}
{{- end }}
