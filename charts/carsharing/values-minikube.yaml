existingSecret: carsharing-secret

ingress:
  enabled: true
  host: carsharing.local

postgres:
  persistence:
    enabled: false

userService:
  replicas: 1
  image:
    repository: "cnnblesss/carsharing-user-service"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

fleetService:
  replicas: 1
  image:
    repository: "cnnblesss/carsharing-fleet-service"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

orderService:
  replicas: 1
  image:
    repository: "cnnblesss/carsharing-order-service"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

config:
  profile: "dev"
  logLevel: "INFO"
